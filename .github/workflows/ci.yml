name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for UI contract tests
        run: npx playwright install --with-deps chromium

      - name: Validate global navigation runtime
        run: npm run check:global-navigation-runtime

      - name: Validate scene disclosures
        run: npm run check:scene-disclosures

      - name: Validate annotation geometry
        run: npm run check:annotation-geometry

      - name: Check local links
        run: npm run check:links

      - name: Build production site
        run: npm run build

      - name: Validate Pages redirect middleware
        run: |
          node --test functions/_middleware.test.mjs
          npm run check:pages-functions

      - name: Validate contact Worker
        run: npm run check:worker
