name: Contact Worker deploy

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "wrangler.contact.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contact-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Meta CAPI secret to contact Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        run: printf '%s' "$META_CAPI_TOKEN" | npx wrangler secret put META_CAPI_TOKEN --config wrangler.contact.jsonc

      - name: Deploy contact Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: deploy --config wrangler.contact.jsonc
