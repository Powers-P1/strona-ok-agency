name: Production monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check production, DNSSEC and certificate
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee monitor-report.txt) 2>&1

          web_curl() {
            curl --silent --show-error --max-time 20 \
              --user-agent 'Mozilla/5.0 (compatible; OKAgency-Monitor/1.0; +https://github.com/Powers-P1/strona-ok-agency)' \
              "$@"
          }

          check_status() {
            local url="$1"
            local expected="$2"
            local actual
            actual="$(web_curl --output /dev/null --write-out '%{http_code}' "$url")"
            case ",$expected," in
              *",$actual,"*) ;;
              *)
                echo "FAIL: $url returned $actual, expected one of $expected"
                return 1
                ;;
            esac
            echo "OK: $url -> $actual"
          }

          dns_query() {
            local name="$1"
            local type="$2"
            curl --silent --show-error --max-time 20 \
              --header 'accept: application/dns-json' \
              --get \
              --data-urlencode "name=$name" \
              --data-urlencode "type=$type" \
              'https://cloudflare-dns.com/dns-query'
          }

          # Cloudflare may return a deliberate 403 challenge to GitHub-hosted
          # datacenter IPs. A 403 still proves DNS, TLS and the edge are healthy;
          # the Pages build and redirect checks verify the application separately.
          check_status "https://okagency.pl/" "200,403"
          check_status "https://okagency.pl/kontakt" "200,403"
          check_status "https://okagency.pl/.well-known/security.txt" "200,403"
          check_status "https://okagency.pl/api/contact" "405,403"

          robots_txt="$(web_curl --fail https://okagency.pl/robots.txt)"
          if printf '%s\n' "$robots_txt" \
            | grep --ignore-case --extended-regexp --quiet 'Cloudflare Managed|Content-Signal:'; then
            echo "FAIL: robots.txt contains a Cloudflare-managed overlay"
            exit 1
          fi
          printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'User-agent: OAI-SearchBot' \
            && printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'User-agent: Claude-SearchBot' \
            && printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'User-agent: Claude-User' \
            && printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'User-agent: Perplexity-User' \
            && printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'User-agent: GPTBot' \
            && printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'User-agent: ClaudeBot' \
            && printf '%s\n' "$robots_txt" | grep --fixed-strings --line-regexp --quiet 'Sitemap: https://okagency.pl/sitemap.xml' \
            && echo "OK: repository-managed robots.txt without Cloudflare overlay" \
            || { echo "FAIL: robots.txt policy is incomplete"; exit 1; }

          test "$(web_curl --head https://www.okagency.pl/ | awk 'tolower($1) == "location:" {gsub(/\r/, ""); print $2}')" = "https://okagency.pl/" \
            && echo "OK: www redirect" \
            || { echo "FAIL: www redirect"; exit 1; }

          test "$(web_curl --head https://ok-agency.pl/ | awk 'tolower($1) == "location:" {gsub(/\r/, ""); print $2}')" = "https://okagency.pl/" \
            && echo "OK: alternate-domain redirect" \
            || { echo "FAIL: alternate-domain redirect"; exit 1; }

          test "$(web_curl --head https://ok-agency.pages.dev/ | awk 'tolower($1) == "location:" {gsub(/\r/, ""); print $2}')" = "https://okagency.pl/" \
            && echo "OK: pages.dev redirect" \
            || { echo "FAIL: pages.dev redirect"; exit 1; }

          web_curl --head https://okagency.pl/ \
            | grep --ignore-case --quiet '^strict-transport-security:.*max-age=' \
            && echo "OK: primary HSTS" \
            || { echo "FAIL: primary HSTS missing"; exit 1; }

          web_curl --head https://ok-agency.pl/ \
            | grep --ignore-case --quiet '^strict-transport-security:.*max-age=' \
            && echo "OK: alternate-domain HSTS" \
            || { echo "FAIL: alternate-domain HSTS missing"; exit 1; }

          test "$(dns_query okagency.pl DNSKEY | jq -r '.AD')" = "true" \
            && echo "OK: primary DNSSEC validation" \
            || { echo "FAIL: primary DNSSEC validation"; exit 1; }

          test "$(dns_query ok-agency.pl DNSKEY | jq -r '.AD')" = "true" \
            && echo "OK: alternate-domain DNSSEC validation" \
            || { echo "FAIL: alternate-domain DNSSEC validation"; exit 1; }

          dns_query _dmarc.okagency.pl TXT \
            | jq --exit-status '
                any(
                  .Answer[]?;
                  .type == 16
                  and (
                    .data
                    | ascii_downcase
                    | gsub("^\"|\"$"; "")
                    | split(";")
                    | map(gsub("^\\s+|\\s+$"; ""))
                    | index("p=quarantine") != null
                  )
                )
              ' >/dev/null \
            && echo "OK: primary DMARC enforcement" \
            || { echo "FAIL: primary DMARC enforcement"; exit 1; }

          dns_query ovhmo-selector-1._domainkey.okagency.pl CNAME \
            | jq --exit-status 'any(.Answer[]?; .type == 5 and (.data | contains("dkim.mail.ovh.net")))' >/dev/null \
            && echo "OK: primary DKIM" \
            || { echo "FAIL: primary DKIM"; exit 1; }

          dns_query _dmarc.ok-agency.pl TXT \
            | jq --exit-status '
                any(
                  .Answer[]?;
                  .type == 16
                  and (
                    .data
                    | ascii_downcase
                    | gsub("^\"|\"$"; "")
                    | split(";")
                    | map(gsub("^\\s+|\\s+$"; ""))
                    | index("p=quarantine") != null
                  )
                )
              ' >/dev/null \
            && echo "OK: alternate-domain DMARC enforcement" \
            || { echo "FAIL: alternate-domain DMARC enforcement"; exit 1; }

          dns_query cf2024-1._domainkey.ok-agency.pl TXT \
            | jq --exit-status 'any(.Answer[]?; .type == 16 and (.data | contains("v=DKIM1")))' >/dev/null \
            && echo "OK: alternate-domain DKIM" \
            || { echo "FAIL: alternate-domain DKIM"; exit 1; }

          dns_query ftp.okagency.pl A \
            | jq --exit-status '((.Answer // []) | length) == 0' >/dev/null \
            && echo "OK: obsolete ftp record absent" \
            || { echo "FAIL: obsolete ftp record returned"; exit 1; }

          check_certificate() {
            local hostname="$1"
            local tls_output
            local cert_end
            local cert_end_epoch
            local minimum_epoch

            if ! tls_output="$(
              timeout 20 openssl s_client \
                -connect "$hostname:443" \
                -servername "$hostname" \
                -verify_hostname "$hostname" \
                -verify_return_error \
                </dev/null 2>&1
            )"; then
              echo "FAIL: TLS chain or hostname validation failed for $hostname"
              echo "$tls_output"
              return 1
            fi

            printf '%s\n' "$tls_output" \
              | grep --quiet 'Verify return code: 0 (ok)' \
              || {
                echo "FAIL: OpenSSL did not confirm a trusted certificate for $hostname"
                echo "$tls_output"
                return 1
              }

            cert_end="$(
              printf '%s\n' "$tls_output" \
                | openssl x509 -noout -enddate \
                | cut -d= -f2
            )"
            test -n "$cert_end" \
              || { echo "FAIL: certificate expiry missing for $hostname"; return 1; }

            cert_end_epoch="$(date --date="$cert_end" +%s)"
            minimum_epoch="$(date --date='+21 days' +%s)"
            test "$cert_end_epoch" -gt "$minimum_epoch" \
              || {
                echo "FAIL: certificate for $hostname expires too soon ($cert_end)"
                return 1
              }

            echo "OK: trusted certificate and hostname for $hostname, valid beyond 21 days ($cert_end)"
          }

          check_certificate "okagency.pl"
          check_certificate "www.okagency.pl"
          check_certificate "ok-agency.pl"
          check_certificate "www.ok-agency.pl"

      - name: Open or update incident issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require("fs");
            const title = "[monitor] Problem z produkcją okagency.pl";
            const report = fs.readFileSync("monitor-report.txt", "utf8").slice(-12000);
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "production-monitor", per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            const body = [
              `Automatyczny monitoring wykrył problem: ${new Date().toISOString()}.`,
              "",
              "```text",
              report,
              "```",
              "",
              `[Uruchomienie workflow](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["production-monitor"]
              });
            }

      - name: Close recovered incident issue
        if: steps.health.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = "[monitor] Problem z produkcją okagency.pl";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "production-monitor", per_page: 100
            });
            for (const issue of issues.filter(issue => issue.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Monitoring ponownie przechodzi poprawnie: ${new Date().toISOString()}.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: "closed"
              });
            }

      - name: Fail workflow when health check failed
        if: steps.health.outcome == 'failure'
        run: exit 1
