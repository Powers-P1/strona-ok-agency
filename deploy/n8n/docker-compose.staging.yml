services:
  audit-runner:
    container_name: okagency-audit-runner
    build:
      context: ../..
      dockerfile: services/site-audit-runner/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      PAGESPEED_ENABLED: "true"
      CALLBACK_HOSTNAMES: "okagency.pl,www.okagency.pl"
      WORKER_N8N_HMAC_SECRET: "${WORKER_N8N_HMAC_SECRET:?missing WORKER_N8N_HMAC_SECRET}"
      N8N_CALLBACK_HMAC_SECRET: "${N8N_CALLBACK_HMAC_SECRET:?missing N8N_CALLBACK_HMAC_SECRET}"
      RUNNER_SESSION_SECRET: "${RUNNER_SESSION_SECRET:?missing RUNNER_SESSION_SECRET}"
      PAGESPEED_API_KEY: "${PAGESPEED_API_KEY:-}"
    networks:
      n8n:
        aliases:
          - audit-runner
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0

networks:
  n8n:
    external: true
    name: n8n_default
