  <style>
    :root {
      --navy: #081523;
      --navy-deep: #040c16;
      --cream: #f0dfcf;
      --pink: #ff5b88;
      --pink-ink: #b52454;
      --blue: #8aa7b7;
      --line: rgba(138, 167, 183, .13);
      --gutter: clamp(1.4rem, 4.3vw, 5rem);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--navy);
    }

    body {
      color: var(--cream);
      font-family: "Archivo", "Aptos", sans-serif;
      overflow-x: hidden;
    }

    button,
    a { font: inherit; }

    button { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--pink);
      outline-offset: 5px;
    }

    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 76% 89%, rgba(55, 82, 105, .2), transparent 31%),
        radial-gradient(ellipse at 47% -14%, rgba(43, 69, 92, .22), transparent 38%),
        linear-gradient(112deg, var(--navy-deep), var(--navy) 58%, #0a1929);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .grid::before,
    .grid::after {
      content: "";
      position: absolute;
      background: var(--line);
    }

    .grid::before {
      inset: 0 var(--gutter);
      border-inline: 1px solid var(--line);
      background:
        linear-gradient(90deg, transparent 49.96%, var(--line) 50%, transparent 50.04%);
    }

    .grid::after {
      inset: clamp(5.2rem, 10vh, 7rem) 0 auto;
      height: 1px;
      box-shadow: 0 calc(100svh - clamp(9.6rem, 19vh, 12rem)) 0 var(--line);
    }

    .topbar {
      position: absolute;
      z-index: 20;
      top: 0;
      left: 0;
      width: 100%;
      height: clamp(5.2rem, 10vh, 7rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--gutter);
    }

    .wordmark {
      display: block;
      width: clamp(7.2rem, 9.8vw, 10.3rem);
      height: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(1.4rem, 3vw, 3.2rem);
    }

    .nav a {
      position: relative;
      color: var(--cream);
      text-decoration: none;
      text-transform: uppercase;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .17em;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding-block: .7rem;
      transition: color .3s ease;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: .17em;
      bottom: .45rem;
      height: 1px;
      background: var(--pink);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .38s var(--ease);
    }

    .nav a:hover,
    .nav a:focus-visible { color: #fff4e7; }

    .nav a:hover::after,
    .nav a:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .copy {
      position: absolute;
      z-index: 12;
      left: var(--gutter);
      top: clamp(10rem, 22vh, 13.5rem);
      width: min(42rem, 43vw);
      transition:
        opacity .55s var(--ease),
        transform .75s var(--ease),
        visibility 0s linear 0s;
    }

    .scene-label,
    .detail-kicker {
      text-transform: uppercase;
      letter-spacing: .2em;
      font-size: clamp(.6rem, .68vw, .72rem);
      font-weight: 600;
    }

    .scene-label {
      display: flex;
      align-items: center;
      gap: .8rem;
      color: var(--blue);
      margin: 0 0 clamp(1.5rem, 3vh, 2.5rem);
    }

    .scene-label::before {
      content: "";
      width: 2.9rem;
      height: 1px;
      background: var(--pink);
    }

    h1 {
      margin: 0;
      max-width: 7.1ch;
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(6.1rem, 10.7vw, 11rem);
      font-weight: 500;
      font-stretch: condensed;
      line-height: .775;
      letter-spacing: -.062em;
      text-wrap: balance;
    }

    h1 span {
      display: block;
      color: var(--pink);
      margin-left: .54em;
    }

    .descriptor {
      margin: clamp(1.7rem, 3.6vh, 2.8rem) 0 0;
      color: rgba(240, 223, 207, .82);
      font-size: clamp(.72rem, .82vw, .88rem);
      letter-spacing: .07em;
      line-height: 1.6;
    }

    .cta {
      position: relative;
      margin-top: clamp(1.6rem, 3.4vh, 2.5rem);
      min-width: 15.5rem;
      padding: 1.05rem 3.6rem 1.05rem 1.25rem;
      border: 1px solid rgba(255, 92, 141, .65);
      border-radius: 0;
      background: rgba(8, 21, 35, .22);
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .035em;
      backdrop-filter: blur(6px);
      transition: color .35s, border-color .35s;
    }

    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--pink);
      transform: translateX(-102%);
      transition: transform .55s var(--ease);
      z-index: -1;
    }

    .cta::after {
      content: "â†—";
      position: absolute;
      right: 1.15rem;
      top: 50%;
      translate: 0 -50%;
      color: var(--pink-ink, var(--pink));
      font-size: 1.1rem;
      transition: color .35s, rotate .55s var(--ease);
    }

    .cta:hover,
    .cta:focus-visible {
      color: var(--navy-deep);
      border-color: var(--pink);
    }

    .cta:hover::before,
    .cta:focus-visible::before { transform: translateX(0); }

    .cta:hover::after,
    .cta:focus-visible::after {
      color: var(--navy-deep);
      rotate: 45deg;
    }

    .cta.is-charging {
      cursor: wait;
      color: var(--navy-deep);
      border-color: var(--cream);
    }

    .cta.is-charging::before {
      transform: translateX(0);
      background:
        linear-gradient(90deg, var(--pink), var(--cream), var(--pink));
      background-size: 220% 100%;
      animation: charge-cta 1.15s ease-in-out infinite;
    }

    .cta.is-charging::after {
      content: "â€¢";
      color: var(--navy-deep);
      rotate: 0deg;
      animation: charge-dot .72s ease-in-out infinite alternate;
    }

    .art-stage {
      position: absolute;
      z-index: 2;
      inset: 0;
      transform-origin: 73% 82%;
      transition: transform 1.45s var(--ease), filter 1.1s var(--ease);
      will-change: transform;
      pointer-events: none;
    }

    .image-rig {
      position: absolute;
      top: 0;
      right: 0;
      height: 100svh;
      aspect-ratio: 1672 / 941;
      max-width: none;
      transform: translate3d(var(--px, 0), var(--py, 0), 0);
      transition: transform .8s var(--ease);
      will-change: transform;
    }

    .sculpture {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .stone-contact,
    .stone-shell,
    .stone-neural-canvas {
      position: absolute;
      pointer-events: none;
    }

    .stone-contact {
      z-index: 1;
      left: 45%;
      top: 93.4%;
      width: 41.2%;
      height: 4.3%;
      opacity: .52;
      background:
        radial-gradient(ellipse at 54% 30%, rgba(3, 5, 8, .88), rgba(4, 8, 12, .46) 43%, transparent 74%);
      filter: blur(4px);
      transform: translateY(1px) scaleX(.96);
    }

    .stone-neural-canvas {
      z-index: 2;
      left: 45.5%;
      top: 69.4%;
      width: 40.5%;
      height: 26.4%;
      mix-blend-mode: screen;
      opacity: .86;
      transition: opacity .45s var(--ease);
      contain: strict;
    }

    .stone-shell {
      z-index: 2;
      left: 45.5%;
      top: 69.4%;
      width: 40.5%;
      height: 26.4%;
      opacity: .46;
      border-radius: 45% 42% 38% 41% / 37% 39% 28% 30%;
      background:
        linear-gradient(108deg, rgba(223, 222, 232, .17), transparent 5.5%, transparent 83%, rgba(178, 117, 119, .04)),
        linear-gradient(0deg, rgba(255, 151, 119, .11), transparent 4.5%, transparent 74%, rgba(204, 201, 214, .035)),
        radial-gradient(ellipse at 7% 53%, rgba(231, 224, 233, .12), transparent 8%),
        radial-gradient(ellipse at 53% 102%, rgba(255, 116, 105, .07), transparent 38%);
      mix-blend-mode: screen;
    }

    .stone-shell::after {
      content: "";
      position: absolute;
      left: 25%;
      right: 11%;
      bottom: -6%;
      height: 13%;
      opacity: var(--stone-caustic, .26);
      background: radial-gradient(ellipse, rgba(255, 133, 105, .24), rgba(255, 81, 115, .06) 38%, transparent 72%);
      filter: blur(7px);
      transform: scaleX(var(--stone-caustic-scale, .78));
      transition: opacity .18s linear;
    }

    .light-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      mix-blend-mode: screen;
      transition: opacity .45s var(--ease);
    }

    .detail {
      position: absolute;
      z-index: 13;
      left: var(--gutter);
      top: clamp(12rem, 28vh, 18rem);
      width: min(31rem, 36vw);
      opacity: 0;
      visibility: hidden;
      transform: translateY(2rem);
      transition:
        opacity .6s var(--ease) .35s,
        transform .8s var(--ease) .35s,
        visibility 0s linear 1.1s;
    }

    .detail-kicker {
      margin: 0 0 1.2rem;
      color: var(--pink-ink, var(--pink));
    }

    .detail h2 {
      margin: 0;
      max-width: 9ch;
      font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
      font-size: clamp(3.7rem, 6vw, 6.8rem);
      line-height: .85;
      letter-spacing: -.045em;
      font-weight: 500;
    }

    .detail p {
      max-width: 34rem;
      margin: 1.7rem 0 0;
      color: rgba(233, 216, 200, .72);
      line-height: 1.7;
      font-size: clamp(.78rem, .9vw, .96rem);
    }

    .detail .anchor-spec {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin-top: 1.35rem;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .62rem;
      line-height: 1.45;
    }

    .detail .anchor-spec::before {
      content: "";
      width: 2.6rem;
      height: 1px;
      flex: 0 0 auto;
      background: linear-gradient(90deg, var(--pink), rgba(255, 92, 141, .12));
    }

    .back {
      margin-top: 1.8rem;
      padding: .9rem 1.1rem;
      border: 0;
      border-left: 1px solid var(--pink);
      background: transparent;
      cursor: pointer;
      color: var(--cream);
      text-transform: uppercase;
      letter-spacing: .15em;
      font-size: .66rem;
    }

    .hero.is-focused .copy {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-2.5rem);
      transition:
        opacity .4s var(--ease),
        transform .65s var(--ease),
        visibility 0s linear .65s;
    }

    .hero.is-focused .art-stage {
      transform: scale(1.65) translate3d(-7%, -5%, 0);
      filter: saturate(.82);
    }

    .hero.is-focused .detail {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        opacity .65s var(--ease) .5s,
        transform .85s var(--ease) .5s,
        visibility 0s;
    }

    .hero.is-focused .light-canvas,
    .hero.is-focused .stone-neural-canvas { opacity: 0; }

    .copy > *,
    .topbar {
      opacity: 0;
      animation: enter .85s var(--ease) forwards;
    }

    .topbar { animation-delay: .05s; }
    .scene-label { animation-delay: .16s; }
    h1 { animation-delay: .24s; }
    .descriptor { animation-delay: .35s; }
    .cta { animation-delay: .43s; }

    @keyframes enter {
      from { opacity: 0; transform: translateY(1.1rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes charge-cta {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes charge-dot {
      from { opacity: .42; transform: scale(.72); }
      to { opacity: 1; transform: scale(1.12); }
    }

      }

        font-size: clamp(4.8rem, 10vw, 6.2rem);
      }
